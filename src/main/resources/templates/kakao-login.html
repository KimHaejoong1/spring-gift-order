<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>카카오 로그인</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/kakao-login.css}" />
  </head>
  <body>
    <div class="login-container">
      <a th:href="${loginUrl}" class="kakao-btn"> 카카오로 로그인하기 </a>
      <div id="codeResult" style="display: none; margin-top: 30px">
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px">
          <strong>인가 코드:</strong><br />
          <span id="authCode" style="font-family: monospace; word-break: break-all"></span>
        </div>
      </div>
    </div>
    <script th:src="@{/js/kakao-login.js}"></script>
  </body>
</html>
